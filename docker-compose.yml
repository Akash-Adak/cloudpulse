```yaml
# CloudPulse production stack:
# Aiven MySQL + Spring Boot backend + React (Nginx)
#
# Usage:
# 1. Copy .env.example to .env and configure secrets.
# 2. Configure Aiven connection details.
# 3. docker compose up --build -d

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true

    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_SHUTDOWN: ${SERVER_SHUTDOWN:-graceful}
      # Aiven MySQL
      DB_HOST: ${DB_HOST:?set DB_HOST in .env}
      DB_PORT: ${DB_PORT:-${DB_HOST_PORT:-24000}}
      DB_NAME: ${MYSQL_DATABASE:-cloudpulse}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

      # Enable SSL for the external database.
      # Your Spring Boot configuration must support these variables.
      DB_SSL_MODE: ${DB_SSL_MODE:-REQUIRED}

      # CloudPulse authentication
      CLOUDPULSE_ADMIN_USERNAME: ${CLOUDPULSE_ADMIN_USERNAME:-admin}
      CLOUDPULSE_ADMIN_PASSWORD: ${CLOUDPULSE_ADMIN_PASSWORD:?set CLOUDPULSE_ADMIN_PASSWORD in .env}
      CLOUDPULSE_JWT_SECRET: ${CLOUDPULSE_JWT_SECRET:?set CLOUDPULSE_JWT_SECRET in .env}
      CLOUDPULSE_JWT_TTL_MINUTES: ${CLOUDPULSE_JWT_TTL_MINUTES:-480}

      # CORS
      CLOUDPULSE_CORS_ALLOWED_ORIGINS: ${CLOUDPULSE_CORS_ALLOWED_ORIGINS:-}

      # Monitoring security
      CLOUDPULSE_ALLOW_PRIVATE_TARGETS: ${CLOUDPULSE_ALLOW_PRIVATE_TARGETS:-false}
      CLOUDPULSE_PROBE_MAX_REDIRECTS: ${CLOUDPULSE_PROBE_MAX_REDIRECTS:-3}
      CLOUDPULSE_SCHEDULER_ENABLED: ${CLOUDPULSE_SCHEDULER_ENABLED:-true}
      CLOUDPULSE_SCHEDULER_TICK_MS: ${CLOUDPULSE_SCHEDULER_TICK_MS:-5000}
      CLOUDPULSE_SCHEDULER_INITIAL_DELAY_MS: ${CLOUDPULSE_SCHEDULER_INITIAL_DELAY_MS:-5000}
      CLOUDPULSE_RECOVERY_THRESHOLD: ${CLOUDPULSE_RECOVERY_THRESHOLD:-1}
      CLOUDPULSE_RETENTION_DAYS: ${CLOUDPULSE_RETENTION_DAYS:-30}
      CLOUDPULSE_RETENTION_CRON: "${CLOUDPULSE_RETENTION_CRON:-0 30 3 * * *}"

      # Alerts
      CLOUDPULSE_ALERTS_ENABLED: ${CLOUDPULSE_ALERTS_ENABLED:-false}
      CLOUDPULSE_ALERT_RECIPIENTS: ${CLOUDPULSE_ALERT_RECIPIENTS:-}
      CLOUDPULSE_ALERT_FROM: ${CLOUDPULSE_ALERT_FROM:-cloudpulse@localhost}

      # Optional SMTP settings
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}

    # Backend accessible only through this EC2 machine.
    # Nginx frontend can proxy API requests to the host.
    ports:
      - "127.0.0.1:8081:8080"

    # Limit resource usage on a small EC2 instance.
    mem_limit: 512m
    cpus: "0.75"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          http://127.0.0.1:8080/actuator/health
          || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    init: true

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    mem_limit: 128m
    cpus: "0.25"

volumes: {}

```
