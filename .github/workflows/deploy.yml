name: Deploy to EC2

# Manual deployment. Authenticates to AWS with GitHub OIDC (no long-lived AWS keys stored in GitHub)
# and runs the deploy on the instance through AWS Systems Manager (no SSH port needed).
# Setup steps: docs/AWS_DEPLOYMENT.md

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CloudPulse deploy ${GITHUB_SHA}" \
            --parameters 'commands=["set -e","cd /opt/cloudpulse","git fetch origin main","git reset --hard origin/main","docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build mysql backend caddy","sleep 45","curl -fsS http://127.0.0.1:8081/actuator/health"]' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "{status:Status,output:StandardOutputContent}" --output json
