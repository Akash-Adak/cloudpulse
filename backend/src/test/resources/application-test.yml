spring:
  datasource:
    url: jdbc:h2:mem:cloudpulse;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

cloudpulse:
  admin:
    username: admin
    password: test-password-123
  jwt:
    secret: test-secret-test-secret-test-secret-123456
  ssrf:
    allow-private-targets: true   # lets tests register 127.0.0.1 without DNS; metadata IPs stay blocked
  scheduler:
    enabled: false
